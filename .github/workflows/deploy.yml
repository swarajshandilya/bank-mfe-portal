name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - run: npx nx build shell --base-href=/bank-mfe-portal/
      - run: npx nx build wealth
      - run: npx nx build credit-risk

      - name: Assemble site
        run: |
          mkdir -p site/remotes/wealth site/remotes/credit-risk
          cp -r dist/apps/shell/browser/. site/
          cp -r dist/apps/wealth/browser/. site/remotes/wealth/
          cp -r dist/apps/credit-risk/browser/. site/remotes/credit-risk/
          cat > site/federation.manifest.json <<'EOF'
          {
            "wealth": "https://swarajshandilya.github.io/bank-mfe-portal/remotes/wealth/remoteEntry.json",
            "credit-risk": "https://swarajshandilya.github.io/bank-mfe-portal/remotes/credit-risk/remoteEntry.json"
          }
          EOF
          cp site/index.html site/404.html
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4