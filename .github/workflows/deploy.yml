name: Deploy (per app)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all:
        description: Deploy everything
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

env:
  BASE: https://swarajshandilya.github.io/bank-mfe-portal

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      shell: ${{ steps.f.outputs.shell == 'true' || steps.f.outputs.shared == 'true' || inputs.all }}
      wealth: ${{ steps.f.outputs.wealth == 'true' || steps.f.outputs.shared == 'true' || inputs.all }}
      credit: ${{ steps.f.outputs.credit == 'true' || steps.f.outputs.shared == 'true' || inputs.all }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            shared:
              - 'libs/shared-ui/**'
              - 'package-lock.json'
              - 'nx.json'
              - 'tsconfig.base.json'
            shell:
              - 'apps/shell/**'
            wealth:
              - 'apps/wealth/**'
            credit:
              - 'apps/credit-risk/**'

  wealth:
    needs: changes
    if: needs.changes.outputs.wealth == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx nx build wealth
      - name: Contract check
        run: |
          f=dist/apps/wealth/browser/remoteEntry.json
          if ! grep -q '"./routes"' "$f"; then echo "Missing exposed ./routes"; exit 1; fi
          if grep -q '@bank/shared-ui' "$f"; then echo "shared-ui must not be shared at runtime"; exit 1; fi
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/apps/wealth/browser
          destination_dir: remotes/wealth
          keep_files: true

  credit-risk:
    needs: [changes, wealth]
    if: ${{ !cancelled() && needs.wealth.result != 'failure' && needs.changes.outputs.credit == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx nx build credit-risk
      - name: Contract check
        run: |
          f=dist/apps/credit-risk/browser/remoteEntry.json
          if ! grep -q '"./routes"' "$f"; then echo "Missing exposed ./routes"; exit 1; fi
          if grep -q '@bank/shared-ui' "$f"; then echo "shared-ui must not be shared at runtime"; exit 1; fi
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/apps/credit-risk/browser
          destination_dir: remotes/credit-risk
          keep_files: true

  shell:
    needs: [changes, wealth, credit-risk]
    if: ${{ !cancelled() && needs.wealth.result != 'failure' && needs['credit-risk'].result != 'failure' && needs.changes.outputs.shell == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx nx build shell --base-href=/bank-mfe-portal/
      - name: Prepare site
        run: |
          cp -r dist/apps/shell/browser site
          cat > site/federation.manifest.json <<EOF
          {
            "wealth": "$BASE/remotes/wealth/remoteEntry.json",
            "credit-risk": "$BASE/remotes/credit-risk/remoteEntry.json"
          }
          EOF
          cp site/index.html site/404.html
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          keep_files: true